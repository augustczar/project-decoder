server:
  port: ${SERVER_PORT_COURSE}
  servlet:
    context-path: '/ead-course/'

spring:
  config:
    import: 'configserver:'
  cloud:
    config:
      discovery:
        service-id: ead-config-server
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
                  
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${POSTGRE_URL_COURSE}
    username: ${POSTGRE_USERNAME_COURSE}
    password: ${POSTGRE_PASSWORD_COURSE}
      
  jpa:
    show-sql: true
    database: POSTGRESQL
    hibernate:
      ddl-auto: update 
  
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES}
    ssl:
      enabled: true    
            
#Configuração para windows terminal padrao de cores            
  output:
    ansi:
      enabled: always

logging:
  level:
    '[com.ead]': trace
    root: info
    '[org.springframework.web]': trace
    '[org.hibernate]': info      

ead:
  api:
    url:
      authuser: 'http://ead-authuser-service/ead-authuser'
  broker:
    exchange:
      userEventExchange: ead.userevent
      notificationCommandExchange: ead.notificationcommand
    queue:
      userEventQueue:
        name: ead.userevent.ms.course
    key:
      notificationCommandKey: ms.notification             

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          
eureka:
  client:
    serviceUrl:
      defaultZone: 'http://localhost:8761/eureka'
  instance:
    hostname: localhost