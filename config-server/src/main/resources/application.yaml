server:
  port: ${SERVER_PORT_CONFIG_SERVER}

spring:
  application:
    name: ead-config-server
#  profiles:
#    active: develop
  cloud:
    config:
      server:
        git:
          uri: https://github.com/augustczar/ead-config-server-repo
          default-label: develop
          username: ${USER_NAME_GIT}
          password: ${ACCESS_TOKEN_GIT}

ead:
  configServer:
    username: ${CONFIG_SERVER_USERNAME}
    password: ${CONFIG_SERVER_PASSWORD}
  serviceRegistry:
    username: ${SERVICE_REGISTRY_USERNAME}
    password: ${SERVICE_REGISTRY_PASSWORD}
          
eureka:
  client:
    service-url:
      defaultZone: 'http://${ead.serviceRegistry.username}:${ead.serviceRegistry.password}@localhost:8761/eureka'
  instance:
    hostname: localhost    
    